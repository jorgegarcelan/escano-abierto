name: Actualizar datos y publicar

on:
  schedule:
    - cron: "17 5 * * 2-6"   # de martes a sábado, 05:17 UTC (07:17 en Madrid en verano)
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial (AAAA-MM-DD). Vacío = últimos 10 días"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Descargar, analizar y construir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ESCANO_MODELO: ${{ vars.ESCANO_MODELO }}
        run: |
          if [ -n "${{ github.event.inputs.desde }}" ]; then
            python -m escano actualizar --desde "${{ github.event.inputs.desde }}"
          else
            python -m escano actualizar
          fi
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "escano-bot"
          git config user.email "escano-bot@users.noreply.github.com"
          git add data site/data.json
          git diff --cached --quiet || git commit -m "Datos del $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
