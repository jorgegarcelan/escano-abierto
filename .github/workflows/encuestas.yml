name: Actualizar encuestas

# Dos veces al día descarga las encuestas nuevas (la tabla de Wikipedia) y las apuestas (Polymarket), rehace la
# media, la proyección de escaños y «Cuánto acertaron», y lo guarda en el repositorio. El push despliega en Vercel.
# Desde el 24 de noviembre no actualiza nada: la ley prohíbe difundir encuestas hasta el cierre de los colegios del
# 29N (LOREG, art. 69.7) y después ya mandan los resultados. Lo decide el propio script (escano/encuestas.py).

on:
  schedule:
    - cron: "40 6 * * *"    # 07:40 en Madrid (hora de invierno): tras las encuestas de los periódicos
    - cron: "40 19 * * *"   # 20:40 en Madrid: tras las de las televisiones
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar   # la misma que «Actualizar datos»: nunca suben a la vez
  cancel-in-progress: false

jobs:
  encuestas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_encuestas.py
      # Las páginas de las elecciones pasadas (para «Cuánto acertaron») no cambian: se guardan entre ejecuciones.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: encuestas-crudos-${{ github.run_id }}
          restore-keys: encuestas-crudos-
      - name: Descargar y calcular
        run: python -m escano.encuestas
      - name: Guardar en el repositorio
        run: |
          git config user.name "escano-bot"
          git config user.email "escano-bot@users.noreply.github.com"
          git add data/encuestas site/datos/encuestas
          git diff --cached --quiet && exit 0
          git commit -m "Encuestas del $(date -u +'%F %H:%M')"
          for intento in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 20))
          done
          exit 1
